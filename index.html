<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kobo Tracker</title>
<meta name="theme-color" content="#0C1410" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root{
    --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#ECEFE7; --ink:#142019; --ink-muted:#586459;
    --border:#DCE3D7; --brand:#A9762F; --brand-ink:#6E4A18; --brand-soft:#F1E4CB;
    --gain:#1F7A46; --gain-bg:#E3F3E8; --loss:#B14B3A; --loss-bg:#FBEAE6;
    --shadow:rgba(20,32,25,0.16); --phone-bezel:#12160F;
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-ui:"Avenir Next","Century Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-mono:"SF Mono","Roboto Mono",Consolas,"Courier New",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C1410; --surface:#141F19; --surface-2:#1B2620; --ink:#EBF0E8; --ink-muted:#96A69A;
      --border:#263229; --brand:#D8A94F; --brand-ink:#F2DDA9; --brand-soft:#2A2211;
      --gain:#4FBE7C; --gain-bg:rgba(79,190,124,0.16); --loss:#E5806F; --loss-bg:rgba(229,128,111,0.16);
      --shadow:rgba(0,0,0,0.5); --phone-bezel:#000000;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-ui); min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
  }

  .lock{
    width:340px; max-width:90vw; background:var(--surface); border:1px solid var(--border);
    border-radius:22px; padding:28px 24px; display:flex; flex-direction:column; gap:14px;
    box-shadow:0 20px 50px -20px var(--shadow);
  }
  .lock .coin{font-size:34px; text-align:center;}
  .lock h1{font-family:var(--font-display); font-size:20px; font-weight:600; margin:0; text-align:center;}
  .lock p{font-size:12.5px; color:var(--ink-muted); text-align:center; margin:0; line-height:1.5;}
  .lock input{
    font-family:var(--font-mono); font-size:16px; padding:12px 14px; border-radius:12px;
    border:1px solid var(--border); background:var(--bg); color:var(--ink); outline:none;
  }
  .lock input:focus{border-color:var(--brand);}
  .lock button{
    font-family:var(--font-ui); font-weight:700; font-size:14px; padding:12px 14px; border-radius:12px;
    border:none; background:var(--brand); color:var(--surface); cursor:pointer;
  }
  .lock button:active{opacity:.85;}
  .lock .err{font-size:12px; color:var(--loss); text-align:center; min-height:14px;}
  .hidden{display:none !important;}

  .phone-wrap{perspective:1400px;}
  .phone{
    width:378px; max-width:92vw; height:800px; max-height:82vh; background:var(--phone-bezel);
    border-radius:52px; padding:14px; box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.04) inset;
    position:relative;
  }
  .screen{position:relative; width:100%; height:100%; background:var(--bg); border-radius:38px; overflow:hidden; display:flex; flex-direction:column;}
  .notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:var(--phone-bezel); border-radius:16px; z-index:5;}
  .app-header{padding:26px 22px 12px; display:flex; align-items:baseline; justify-content:space-between; flex-shrink:0;}
  .app-name{font-family:var(--font-display); font-weight:600; font-size:21px;}
  .app-name::before{content:"\20A6"; color:var(--brand); margin-right:4px;}
  .app-date{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted);}
  .screens{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 22px 24px;}
  .screen-panel{display:none; flex-direction:column; gap:18px;}
  .screen-panel.active{display:flex;}
  .hero{background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:20px 20px 18px; display:flex; flex-direction:column; gap:10px;}
  .label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted);}
  .value{font-family:var(--font-display); font-size:34px; font-weight:600; font-variant-numeric:tabular-nums;}
  .hero-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pill{font-family:var(--font-mono); font-size:12px; font-weight:600; padding:4px 10px; border-radius:100px; display:inline-flex; gap:4px;}
  .pill.gain{background:var(--gain-bg); color:var(--gain);}
  .pill.loss{background:var(--loss-bg); color:var(--loss);}
  .sub{font-size:12.5px; color:var(--ink-muted);}
  .section-title{font-weight:700; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); margin:2px 0 10px;}
  .platform-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .platform-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:6px;}
  .platform-card .pname{font-size:12px; font-weight:700;}
  .platform-card .pvalue{font-family:var(--font-mono); font-size:13px;}
  .platform-card .pret{font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--gain);}
  .movers{display:flex; flex-direction:column; gap:10px;}
  .mover-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 14px;}
  .mover-ticker{font-family:var(--font-mono); font-weight:700; font-size:13px;}
  .holding-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border);}
  .holding-row:last-child{border-bottom:none;}
  .h-left{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .h-ticker{font-family:var(--font-mono); font-weight:700; font-size:13.5px;}
  .h-sub{font-size:11px; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px;}
  .h-right{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0;}
  .h-value{font-family:var(--font-mono); font-size:13px;}
  .h-pct{font-family:var(--font-mono); font-size:11px; font-weight:700;}
  .h-pct.gain{color:var(--gain);}
  .h-pct.loss{color:var(--loss);}
  .spot-hero{background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%); border:1px solid var(--border); border-radius:22px; padding:20px; display:flex; flex-direction:column; gap:8px;}
  .spot-ticker{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted); letter-spacing:.08em; text-transform:uppercase;}
  .spot-name{font-family:var(--font-display); font-size:24px; font-weight:600;}
  .spot-value{font-family:var(--font-mono); font-size:22px; margin-top:2px;}
  .plat-breakdown{display:flex; flex-direction:column; gap:10px;}
  .plat-row{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 14px; display:flex; flex-direction:column; gap:8px;}
  .pr-top{display:flex; align-items:center; justify-content:space-between;}
  .pr-name{font-weight:700; font-size:13px;}
  .pr-tag{font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:100px; background:var(--brand-soft); color:var(--brand-ink);}
  .pr-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .pr-grid div{display:flex; flex-direction:column; gap:1px;}
  .pr-grid .k{font-size:9.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
  .pr-grid .v{font-family:var(--font-mono); font-size:12px;}
  .callout{font-size:12px; color:var(--ink-muted); line-height:1.5; background:var(--surface-2); border-radius:14px; padding:12px 14px;}
  .callout b{color:var(--ink);}
  .tabbar{flex-shrink:0; display:flex; border-top:1px solid var(--border); background:var(--surface); padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));}
  .tab{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0 0; font-size:10.5px; font-weight:600; color:var(--ink-muted); cursor:pointer;}
  .tab svg{width:20px; height:20px; stroke:var(--ink-muted); fill:none; stroke-width:1.6;}
  .tab.active{color:var(--brand);}
  .tab.active svg{stroke:var(--brand);}
</style>
</head>
<body>

  <div class="lock" id="lock">
    <div class="coin">🪙</div>
    <h1>Kobo Tracker</h1>
    <p>Enter your passphrase to unlock your portfolio.</p>
    <input type="password" id="pw" placeholder="Passphrase" autocomplete="current-password" />
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>

  <div class="phone-wrap hidden" id="app">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="app-header">
          <span class="app-name">Kobo</span>
          <span class="app-date">15 Aug 2026</span>
        </div>
        <div class="screens">
          <section id="overview" class="screen-panel active"></section>
          <section id="holdings" class="screen-panel"></section>
          <section id="spotlight" class="screen-panel"></section>
        </div>
        <nav class="tabbar">
          <button class="tab active" data-target="overview">Overview</button>
          <button class="tab" data-target="holdings">Holdings</button>
          <button class="tab" data-target="spotlight">Spotlight</button>
        </nav>
      </div>
    </div>
  </div>

<script>

  function b64ToBuf(b64){
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function tryUnlock(password){
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: b64ToBuf(ENC.salt), iterations: ENC.iterations, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]
    );
    var plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv: b64ToBuf(ENC.iv) }, key, b64ToBuf(ENC.ciphertext));
    var json = new TextDecoder().decode(plainBuf);
    return JSON.parse(json);
  }

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function pillClass(v){ return v >= 0 ? "gain" : "loss"; }
  function fmtPct(v){ return (v>=0?"+":"−") + Math.abs(v).toFixed(2) + "%"; }

  function render(data){
    var ov = document.getElementById("overview");

      '<div class="hero">'+

      '</div></div>'+
      '<div><div class="section-title">Best Movers</div><div class="movers">'+

      '<div><div class="section-title">Worst Movers</div><div class="movers">'+

      '</div></div>';

    var hd = document.getElementById("holdings");
    hd.innerHTML = '<div class="section-title">All Holdings &middot; by value</div><div>'+

        var pct = h[3];
        return '<div class="holding-row">'+
          '<div class="h-left"><span class="h-ticker">'+esc(h[0])+'</span><span class="h-sub">'+esc(h[1])+'</span></div>'+

        '</div>';
      }).join('')+
    '</div>';

    var sp = document.getElementById("spotlight");
    var s = data.spotlight;
    sp.innerHTML =
      '<div class="spot-hero">'+
        '<span class="spot-ticker">Spotlight &middot; cross-platform</span>'+
        '<span class="spot-name">'+esc(s.ticker)+'</span>'+
        '<span class="spot-value">'+esc(s.value)+'</span>'+
        '<div class="hero-row"><span class="pill gain">▲ '+esc(s.gain)+'</span><span class="pill gain">'+esc(s.pct)+'</span></div>'+
        '<span class="sub">'+esc(s.sub)+'</span>'+
      '</div>'+
      '<div><div class="section-title">Held On</div><div class="plat-breakdown">'+
        s.platforms.map(function(p){
          return '<div class="plat-row"><div class="pr-top"><span class="pr-name">'+esc(p.name)+'</span><span class="pr-tag">'+esc(p.tag)+'</span></div>'+
            '<div class="pr-grid"><div><span class="k">Qty</span><span class="v">'+esc(p.qty)+'</span></div>'+
            '<div><span class="k">Avg cost</span><span class="v">'+esc(p.avg)+'</span></div>'+

        }).join('')+
      '</div></div>'+
      '<div class="callout"><b>Why it’s spotlighted:</b> '+esc(s.note)+'</div>';

    document.querySelectorAll(".tab").forEach(function(tab){
      tab.addEventListener("click", function(){
        document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
        document.querySelectorAll(".screen-panel").forEach(function(p){ p.classList.remove("active"); });
        tab.classList.add("active");
        document.getElementById(tab.dataset.target).classList.add("active");
        document.querySelector(".screens").scrollTop = 0;
      });
    });
  }

  document.getElementById("unlock").addEventListener("click", attemptUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e){ if (e.key === "Enter") attemptUnlock(); });

  function attemptUnlock(){
    var pw = document.getElementById("pw").value;
    var errEl = document.getElementById("err");
    errEl.textContent = "";
    tryUnlock(pw).then(function(data){
      render(data);
      document.getElementById("lock").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      try { sessionStorage.setItem("kobo_pw", pw); } catch(e){}
    }).catch(function(){
      errEl.textContent = "Wrong passphrase. Try again.";
    });
  }

  (function(){
    try {
      var cached = sessionStorage.getItem("kobo_pw");
      if (cached) {
        tryUnlock(cached).then(function(data){
          render(data);
          document.getElementById("lock").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
        }).catch(function(){ sessionStorage.removeItem("kobo_pw"); });
      }
    } catch(e){}
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function(){});
  }
</script>
</body>
</html>
